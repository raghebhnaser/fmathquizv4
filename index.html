<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>RacingBars</title><meta name="title" content="RacingBars"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {
    "racing-bars": "https://racing-bars.hatemhosny.dev/lib/racing-bars.js",
    "racing-bars/react": "https://racing-bars.hatemhosny.dev/lib/react.js",
    "racing-bars/vue": "https://racing-bars.hatemhosny.dev/lib/vue.js"
  }
}</script></head><body>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي العباقرة - قناة وسام التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; --card-bg: #111; --text-main: white;
            --accent-color: #00ffff; --sec-color: #ff00ff; --quest-color: #fefe00;
        }
        /* الثيمات القديمة والجديدة الفاقعة */
        body.theme-light { --bg-color: #FFFAF0; --card-bg: #ffffff; --text-main: #2D3436; --accent-color: #0984E3; --sec-color: #E84393; --quest-color: #e67e22; }
        body.theme-galaxy { --bg-color: #0f0c29; --card-bg: rgba(255, 255, 255, 0.1); --text-main: #ffffff; --accent-color: #a29bfe; --sec-color: #00d2ff; --quest-color: #55efc4; }
        body.theme-kids-mickey { --bg-color: #ff0000; --card-bg: #fff; --text-main: #000; --accent-color: #fefe00; --sec-color: #000; --quest-color: #fff; }
        body.theme-kids-garden { --bg-color: #2ecc71; --card-bg: #fff; --text-main: #2c3e50; --accent-color: #e84393; --sec-color: #f1c40f; --quest-color: #fff; }
        body.theme-kids-neon { --bg-color: #00ff00; --card-bg: #000; --text-main: #fff; --accent-color: #ff00ff; --sec-color: #ffff00; --quest-color: #00ffff; }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Cairo', sans-serif; transition: all 0.5s ease; }

        /* شاشة الإعدادات */
        #setup-screen { 
            position: absolute; z-index: 1000; background: var(--card-bg); width: 90%; max-width: 550px; 
            max-height: 90vh; padding: 20px; border-radius: 20px; border: 6px solid var(--accent-color);
            left: 50%; top: 50%; transform: translate(-50%, -50%); overflow-y: auto; text-align: center; box-sizing: border-box; color: var(--text-main);
        }

        .tab-header { display: flex; gap: 5px; margin-bottom: 20px; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 5px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-family: 'Cairo'; background: transparent; color: var(--text-main); font-weight: bold; }
        .tab-btn.active { background: var(--accent-color); color: #000; }
        .tab-content { display: none; text-align: right; }
        .tab-content.active { display: block; }

        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 3px; color: var(--sec-color); font-weight: bold; }
        input, select { width: 100%; padding: 10px; border-radius: 12px; border: 2px solid #ced4da; font-family: 'Cairo'; box-sizing: border-box; }
        
        .ops-selector { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
        .ops-selector label { background: #eee; padding: 5px 12px; border-radius: 15px; color: #333; cursor: pointer; }

        .manual-q-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--accent-color); }
        .opt-row { display: grid; grid-template-columns: 35px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 5px; background: rgba(0,0,0,0.1); padding: 5px; border-radius: 8px; }

        /* شاشة اللعب - مرنة بالكامل وبدون سكرول */
        #video-screen { 
            display: none; width: 100vw; height: 100vh; flex-direction: column; align-items: center; 
            justify-content: space-between; padding: 15px; box-sizing: border-box; 
            border: 12px solid; animation: rainbowBorder 3s linear infinite;
        }
        @keyframes rainbowBorder { 0%, 100% { border-color: var(--sec-color); } 50% { border-color: var(--accent-color); } }

        #timer-box { 
            flex-shrink: 0; font-size: 2.5rem; background: var(--sec-color); color: white; 
            width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; 
            align-items: center; border: 5px solid white; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .question-container {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; overflow: hidden; text-align: center;
        }

        #question-text { 
            font-size: clamp(1.5rem, 6vh, 4rem); font-weight: 900; color: var(--quest-color); 
            text-shadow: 3px 3px 0px #000; margin: 5px 0;
        }

        .watermark { 
            font-size: 1rem; color: var(--text-main); opacity: 0.9; background: rgba(0,0,0,0.3); 
            padding: 3px 20px; border-radius: 50px; border: 2px solid var(--accent-color); margin-bottom: 10px;
        }

        #q-main-img { 
            max-height: 30vh; max-width: 85%; border-radius: 15px; border: 4px solid var(--accent-color); 
            object-fit: contain; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* شبكة الأجوبة من اليمين لليسار */
        .options-grid { 
            flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            width: 100%; max-width: 850px; direction: rtl; padding-bottom: 10px;
        }

        .option-card { 
            background: var(--card-bg); border: 5px solid var(--accent-color); padding: 10px; 
            border-radius: 20px; text-align: center; position: relative; color: var(--text-main); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 12vh; box-shadow: 0 6px 0 var(--accent-color); box-sizing: border-box;
        }

        .opt-img-display { max-height: 8vh; max-width: 90%; border-radius: 10px; margin-bottom: 5px; object-fit: contain; }
        
        .letter-label { 
            position: absolute; top: -12px; right: -12px; background: var(--quest-color); color: #000; 
            width: 35px; height: 35px; border-radius: 50%; font-size: 1.2rem; display: flex; 
            justify-content: center; align-items: center; font-weight: 900; border: 3px solid white;
        }

        .correct-glow { 
            background: #00FF00 !important; color: #000 !important; border-color: #fff !important; 
            box-shadow: 0 0 30px #00FF00; transform: scale(1.05); z-index: 10; animation: shake 0.5s infinite;
        }
        @keyframes shake { 0%, 100% { transform: scale(1.05) rotate(0); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }

    </style>



    <div id="setup-screen">
        <h2 style="color:#D63031; margin-top:0;">🌟 قناة وسام التعليمية</h2>
        
        <div class="tab-header">
            <button class="tab-btn active" onclick="switchTab('math-tab', this)">🔢 حساب ذكي</button>
            <button class="tab-btn" onclick="switchTab('manual-tab', this)">📸 أسئلة وصور</button>
        </div>

        <div id="math-tab" class="tab-content active">
            <div class="input-group">
                <label>العمليات الحسابية:</label>
                <div class="ops-selector">
                    <label><input type="checkbox" class="op-check" value="+" checked=""> +</label>
                    <label><input type="checkbox" class="op-check" value="-" checked=""> -</label>
                    <label><input type="checkbox" class="op-check" value="×" checked=""> ×</label>
                    <label><input type="checkbox" class="op-check" value="÷"> ÷</label>
                </div>
            </div>
            <div class="input-group">
                <label>مستوى الصعوبة:</label>
                <select id="diff-select">
                    <option value="easy">سهل (1-10)</option>
                    <option value="medium" selected="">متوسط (1-100)</option>
                    <option value="hard">صعب (1-500)</option>
                </select>
            </div>
            <div class="input-group"><label>عدد الأسئلة:</label><input type="number" id="math-count" value="10"></div>
        </div>

        <div id="manual-tab" class="tab-content">
            <div id="manual-container"></div>
            <button onclick="addManualQ()" style="width:100%; padding:10px; background:var(--accent-color); border:none; border-radius:10px; font-weight:bold; cursor:pointer">➕ أضف سؤال (خيار متعدد أو جواب مباشر)</button>
        </div>

        <div class="input-group" style="margin-top:15px">
            <label>وقت التفكير (ثواني):</label>
            <input type="number" id="time-input" value="10">
            <label>اختر الثيم الفاقع:</label>
            <select id="theme-select">
                <option value="default">🌙 نيون (أصلي)</option>
                <option value="theme-kids-mickey">🍎 ميكي (أحمر وأصفر فاقع)</option>
                <option value="theme-kids-garden">🌸 الحديقة (أخضر وفوشيا)</option>
                <option value="theme-kids-neon">🟢 الفسفوري (فاقع جداً)</option>
                <option value="theme-light">🌈 ألوان المرح</option>
                <option value="theme-galaxy">🌌 فضاء المجرة</option>
            </select>
        </div>

        <button onclick="startChallenge()" style="width:100%; padding:15px; background:#D63031; color:white; border-radius:50px; border:none; font-weight:bold; font-size:1.4rem; cursor:pointer; margin-top:10px">ابدأ العرض 🚀</button>
    </div>

    <div id="video-screen">
        <div id="timer-box">10</div>
        
        <div class="question-container">
            <div id="question-text">?</div>
            <div class="watermark">قناة وسام التعليمية</div>
            <img id="q-main-img">
        </div>

        <div class="options-grid" id="options-container"></div>
    </div>

    <audio id="audio-tick" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="audio-win" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <script>
        let mode = 'math', currentStep = 0, config = {}, manualData = [];

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ar-SA';
            window.speechSynthesis.speak(msg);
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            mode = (tabId === 'math-tab') ? 'math' : 'manual';
        }

        function addManualQ() {
            const div = document.createElement('div');
            div.className = 'manual-q-box';
            div.innerHTML = `
                <input type="text" placeholder="نص السؤال" class="m-q-text" style="width:100%; margin-bottom:8px">
                <label>صورة السؤال: <input type="file" class="m-q-img" accept="image/*"></label>
                <div style="font-size:0.7rem; color:red; margin:5px 0">* ضع إجابة واحدة فقط لنمط "سؤال وجواب".</div>
                ${[0,1,2,3].map(i => `
                    <div class="opt-row">
                        <input type="checkbox" class="m-is-correct" ${i===0?'checked':''}>
                        <input type="text" placeholder="خيار ${i+1}" class="m-opt-txt">
                        <input type="file" class="m-opt-img" accept="image/*">
                    </div>
                `).join('')}
            `;
            document.getElementById('manual-container').appendChild(div);
        }

        async function startChallenge() {
            document.body.className = document.getElementById('theme-select').value;
            config = {
                time: parseInt(document.getElementById('time-input').value),
                total: mode === 'math' ? parseInt(document.getElementById('math-count').value) : 0,
                ops: Array.from(document.querySelectorAll('.op-check:checked')).map(el => el.value),
                diff: document.getElementById('diff-select').value
            };

            if (mode === 'manual') {
                const boxes = document.querySelectorAll('.manual-q-box');
                manualData = [];
                for (let box of boxes) {
                    let opts = [];
                    const texts = box.querySelectorAll('.m-opt-txt');
                    const imgs = box.querySelectorAll('.m-opt-img');
                    const checks = box.querySelectorAll('.m-is-correct');
                    for(let i=0; i<4; i++) {
                        if(texts[i].value || imgs[i].files[0]) {
                            opts.push({ text: texts[i].value, img: await toBase64(imgs[i].files[0]), isCorrect: checks[i].checked });
                        }
                    }
                    manualData.push({ q: box.querySelector('.m-q-text').value, qImg: await toBase64(box.querySelector('.m-q-img').files[0]), options: opts });
                }
                config.total = manualData.length;
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('video-screen').style.display = 'flex';
            playStep();
        }

        function toBase64(file) {
            return new Promise(res => { if(!file) return res(null); const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(file); });
        }

        function generateMath() {
            let max = config.diff === 'easy' ? 10 : config.diff === 'medium' ? 100 : 500;
            let op = config.ops[Math.floor(Math.random() * config.ops.length)];
            let n1, n2, ans;
            if(op === '+') { n1 = Math.floor(Math.random()*max)+1; n2 = Math.floor(Math.random()*max)+1; ans = n1+n2; }
            else if(op === '-') { n1 = Math.floor(Math.random()*max)+10; n2 = Math.floor(Math.random()*n1); ans = n1-n2; }
            else if(op === '×') { n1 = Math.floor(Math.random()*12)+2; n2 = Math.floor(Math.random()*10)+2; ans = n1*n2; }
            else { n2 = Math.floor(Math.random()*9)+2; ans = Math.floor(Math.random()*10)+1; n1 = n2*ans; }
            let opts = [{t: ans, isCorrect: true}];
            while(opts.length < 4) {
                let f = ans + (Math.floor(Math.random()*10)-5);
                if(f !== ans && !opts.find(o => o.t === f)) opts.push({t: f, isCorrect: false});
            }
            return { q: `${n1} ${op} ${n2}`, options: opts.sort(() => Math.random()-0.5) };
        }

        function playStep() {
            if (currentStep >= config.total) {
                document.getElementById('video-screen').innerHTML = "<h1 style='font-size:3rem; color:white;'>🏆 أحسنت! انتهى العرض</h1>";
                return;
            }

            let data;
            if (mode === 'math') {
                data = generateMath();
                speak("كم يساوي " + data.q.replace('×','ضرب').replace('÷','تقسيم'));
            } else {
                const m = manualData[currentStep];
                data = { q: m.q, qImg: m.qImg, options: [...m.options] };
                if(data.options.length > 1) data.options.sort(() => Math.random() - 0.5);
                speak(data.q || "اختر الإجابة");
            }

            const qImgEl = document.getElementById('q-main-img');
            document.getElementById('question-text').innerText = data.q || "";
            if(data.qImg) { qImgEl.src = data.qImg; qImgEl.style.display = 'block'; } else { qImgEl.style.display = 'none'; }

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            const letters = ['أ', 'ب', 'ج', 'د'];

            if(data.options.length === 1) {
                container.style.display = 'none';
            } else {
                container.style.display = 'grid';
                data.options.forEach((opt, i) => {
                    const card = document.createElement('div');
                    card.className = 'option-card';
                    if(opt.isCorrect) card.classList.add('correct-ans-target');
                    let imgPart = opt.img ? `<img src="${opt.img}" class="opt-img-display">` : '';
                    card.innerHTML = `<div class="letter-label">${letters[i]}</div>${imgPart}<span>${opt.text || opt.t || ''}</span>`;
                    opt.letter = letters[i];
                    container.appendChild(card);
                });
            }

            let timer = config.time;
            document.getElementById('timer-box').innerText = timer;
            let inter = setInterval(() => {
                timer--;
                document.getElementById('timer-box').innerText = timer;
                if(timer >= 0) document.getElementById('audio-tick').play();
                if(timer <= 0) {
                    clearInterval(inter);
                    document.getElementById('audio-win').play();
                    
                    if(data.options.length === 1) {
                        container.style.display = 'flex';
                        container.innerHTML = `<div class="option-card correct-glow" style="width:100%; font-size:2rem;"><span>${data.options[0].text}</span></div>`;
                        speak("الإجابة الصحيحة هي " + data.options[0].text);
                    } else {
                        document.querySelectorAll('.correct-ans-target').forEach(el => el.classList.add('correct-glow'));
                        let corrects = data.options.filter(o => o.isCorrect);
                        let speechTxt = "الإجابة الصحيحة هي: ";
                        corrects.forEach(c => speechTxt += (c.text || c.t ? (c.text || c.t) : "الخيار " + c.letter) + " ");
                        speak(speechTxt);
                    }
                    setTimeout(() => { currentStep++; playStep(); }, 5000);
                }
            }, 1000);
        }
        addManualQ();
    </script>

<script src="./script.js"></script></body></html>
