<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحدي العباقرة - قناة وسام التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; --card-bg: #111; --text-main: white;
            --accent-color: #00ffff; --sec-color: #ff00ff; --quest-color: #fefe00;
        }
        /* الثيمات */
        body.theme-light { --bg-color: #FFFAF0; --card-bg: #ffffff; --text-main: #2D3436; --accent-color: #0984E3; --sec-color: #E84393; --quest-color: #e67e22; }
        body.theme-galaxy { --bg-color: #0f0c29; --card-bg: rgba(255, 255, 255, 0.1); --text-main: #ffffff; --accent-color: #a29bfe; --sec-color: #00d2ff; --quest-color: #55efc4; }
        body.theme-kids-mickey { --bg-color: #ff0000; --card-bg: #fff; --text-main: #000; --accent-color: #fefe00; --sec-color: #000; --quest-color: #fff; }
        body.theme-kids-neon { --bg-color: #00ff00; --card-bg: #000; --text-main: #fff; --accent-color: #ff00ff; --sec-color: #ffff00; --quest-color: #00ffff; }

        body { 
            margin: 0; background-color: var(--bg-color); color: var(--text-main); 
            font-family: 'Cairo', sans-serif; display: flex; justify-content: center; 
            align-items: center; height: 100vh; width: 100vw; overflow: hidden; 
        }

        /* شاشة الإعدادات */
        #setup-screen { 
            background: var(--card-bg); padding: 15px; border-radius: 20px; border: 5px solid var(--accent-color); 
            text-align: center; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; 
        }

        .tab-header { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 5px; }
        .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; background: #eee; }
        .tab-btn.active { background: var(--accent-color); color: #000; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-group { margin-bottom: 10px; text-align: right; }
        label { display: block; margin-bottom: 2px; color: var(--sec-color); font-weight: bold; font-size: 0.9rem; }
        select, input { width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #ccc; font-family: 'Cairo'; box-sizing: border-box; }
        
        .manual-q-box { background: rgba(0,0,0,0.05); padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--accent-color); }
        .opt-row { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 5px; margin-bottom: 5px; align-items: center; }

        /* شاشة اللعب (Responsive) */
        #video-screen { 
            display: none; width: 100vw; height: 100vh; flex-direction: column; 
            align-items: center; justify-content: flex-start; position: relative; 
            padding: 10px; box-sizing: border-box; border: 10px solid; 
            animation: rainbowBorder 3s linear infinite; overflow-y: auto;
        }
        @keyframes rainbowBorder { 0%, 100% { border-color: var(--sec-color); } 50% { border-color: var(--accent-color); } }
        
        #timer-box { 
            font-size: 2rem; background: var(--sec-color); color: white; 
            min-width: 70px; min-height: 70px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            border: 4px solid white; margin-bottom: 5px; flex-shrink: 0;
        }

        .question-area { 
            text-align: center; width: 100%; display: flex; flex-direction: column; 
            align-items: center; gap: 5px; flex-shrink: 0;
        }

        #question-text { 
            font-size: clamp(1.5rem, 6vw, 3.5rem); font-weight: 900; 
            color: var(--quest-color); text-shadow: 2px 2px 0px #000; margin: 0;
        }

        .watermark { 
            font-size: 0.9rem; color: var(--text-main); opacity: 0.8; 
            background: rgba(0,0,0,0.3); padding: 2px 12px; border-radius: 20px; 
            border: 1px solid var(--accent-color);
        }

        #q-main-img { 
            max-height: 25vh; max-width: 90%; border-radius: 12px; 
            border: 3px solid var(--accent-color); margin-top: 10px; 
            display: none; object-fit: contain; flex-shrink: 0;
        }

        .options-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; 
            width: 100%; max-width: 800px; direction: rtl; margin-top: auto; 
            margin-bottom: 10px; padding: 10px 0;
        }

        .option-card { 
            background: var(--card-bg); border: 4px solid var(--accent-color); 
            padding: 10px; border-radius: 15px; text-align: center; 
            position: relative; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; min-height: 80px; 
            box-shadow: 0 5px 0 var(--accent-color);
        }

        .opt-img-display { max-height: 70px; max-width: 100%; border-radius: 8px; margin-bottom: 5px; object-fit: contain; }
        
        .letter-label { 
            position: absolute; top: -10px; right: -10px; background: var(--quest-color); 
            color: #000; width: 30px; height: 30px; border-radius: 50%; 
            font-size: 1rem; display: flex; justify-content: center; 
            align-items: center; font-weight: 900; border: 2px solid white;
        }

        .correct-glow { 
            background: #00FF00 !important; color: #000 !important; 
            box-shadow: 0 0 30px #00FF00; transform: scale(1.05); z-index: 5;
        }

        /* تحسين للموبايل الصغير جداً */
        @media (max-height: 600px) {
            #question-text { font-size: 1.2rem; }
            #timer-box { min-width: 50px; min-height: 50px; font-size: 1.5rem; }
            .option-card { min-height: 60px; padding: 5px; }
            .opt-img-display { max-height: 40px; }
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2 style="color:#D63031; margin-top:0;">🎮 إعدادات التحدي</h2>
        <div class="tab-header">
            <button class="tab-btn active" onclick="switchTab('math-tab', this)">🔢 حساب تلقائي</button>
            <button class="tab-btn" onclick="switchTab('manual-tab', this)">📸 صور مخصصة</button>
        </div>

        <div id="math-tab" class="tab-content active">
            <div class="input-group">
                <label>العمليات:</label>
                <div style="display:flex; justify-content:center; gap:10px;">
                    <label style="color:inherit"><input type="checkbox" class="op-check" value="+" checked> +</label>
                    <label style="color:inherit"><input type="checkbox" class="op-check" value="-" checked> -</label>
                    <label style="color:inherit"><input type="checkbox" class="op-check" value="×" checked> ×</label>
                    <label style="color:inherit"><input type="checkbox" class="op-check" value="÷"> ÷</label>
                </div>
            </div>
            <div class="input-group">
                <label>الصعوبة:</label>
                <select id="diff-select"><option value="easy">سهل</option><option value="medium" selected>متوسط</option><option value="hard">صعب</option></select>
            </div>
            <div class="input-group"><label>عدد الأسئلة:</label><input type="number" id="math-count" value="5"></div>
        </div>

        <div id="manual-tab" class="tab-content">
            <div id="manual-container"></div>
            <button onclick="addManualQ()" style="width:100%; padding:8px; background:var(--accent-color); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">➕ أضف سؤالاً</button>
        </div>

        <div class="input-group" style="margin-top:10px;">
            <label>وقت التفكير:</label><input type="number" id="time-input" value="10">
            <label>الثيم:</label>
            <select id="theme-select">
                <option value="default">🌙 نيون</option>
                <option value="theme-kids-mickey">🍎 ميكي (أحمر)</option>
                <option value="theme-kids-neon">🟢 فسفوري (أخضر)</option>
                <option value="theme-light">🌈 ألوان المرح</option>
            </select>
        </div>
        <button onclick="startChallenge()" style="width:100%; padding:12px; background:#D63031; color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.2rem; cursor:pointer; margin-top:10px;">ابدأ الآن 🚀</button>
    </div>

    <div id="video-screen">
        <div id="timer-box">10</div>
        <div class="question-area">
            <div id="question-text">?</div>
            <div class="watermark">قناة وسام التعليمية</div>
            <img id="q-main-img">
        </div>
        <div class="options-grid" id="options-container"></div>
    </div>

    <audio id="audio-tick" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="audio-win" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

    <script>
        let mode = 'math', currentStep = 0, config = {}, manualData = [];

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ar-SA';
            window.speechSynthesis.speak(msg);
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            mode = (tabId === 'math-tab') ? 'math' : 'manual';
        }

        function addManualQ() {
            const div = document.createElement('div');
            div.className = 'manual-q-box';
            div.innerHTML = `
                <input type="text" placeholder="السؤال" class="m-q-text" style="margin-bottom:5px">
                <input type="file" class="m-q-img" accept="image/*" style="font-size:0.7rem">
                ${[0,1,2,3].map(i => `
                    <div class="opt-row">
                        <input type="checkbox" class="m-is-correct" ${i===0?'checked':''}>
                        <input type="text" placeholder="خيار ${i+1}" class="m-opt-txt">
                        <input type="file" class="m-opt-img" accept="image/*" style="width:70px; font-size:0.5rem">
                    </div>
                `).join('')}
            `;
            document.getElementById('manual-container').appendChild(div);
        }

        async function startChallenge() {
            document.body.className = document.getElementById('theme-select').value;
            config = {
                time: parseInt(document.getElementById('time-input').value),
                total: mode === 'math' ? parseInt(document.getElementById('math-count').value) : 0,
                ops: Array.from(document.querySelectorAll('.op-check:checked')).map(el => el.value),
                diff: document.getElementById('diff-select').value
            };

            if (mode === 'manual') {
                const boxes = document.querySelectorAll('.manual-q-box');
                manualData = [];
                for (let box of boxes) {
                    let opts = [];
                    const texts = box.querySelectorAll('.m-opt-txt');
                    const imgs = box.querySelectorAll('.m-opt-img');
                    const checks = box.querySelectorAll('.m-is-correct');
                    for(let i=0; i<4; i++) {
                        if(texts[i].value || imgs[i].files[0]) {
                            opts.push({ text: texts[i].value, img: await toBase64(imgs[i].files[0]), isCorrect: checks[i].checked });
                        }
                    }
                    manualData.push({ q: box.querySelector('.m-q-text').value, qImg: await toBase64(box.querySelector('.m-q-img').files[0]), options: opts });
                }
                config.total = manualData.length;
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('video-screen').style.display = 'flex';
            playStep();
        }

        function toBase64(file) {
            return new Promise(res => { if(!file) return res(null); const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(file); });
        }

        function generateMath() {
            let max = config.diff === 'easy' ? 10 : config.diff === 'medium' ? 50 : 100;
            let op = config.ops[Math.floor(Math.random() * config.ops.length)];
            let n1 = Math.floor(Math.random()*max)+1, n2 = Math.floor(Math.random()*max)+1, ans;
            if(op === '+') ans = n1+n2;
            else if(op === '-') { n1 = Math.max(n1, n2); n2 = Math.min(n1, n2); ans = n1-n2; }
            else if(op === '×') { n1 = Math.floor(Math.random()*12); n2 = Math.floor(Math.random()*10); ans = n1*n2; }
            else { n2 = Math.floor(Math.random()*9)+1; ans = Math.floor(Math.random()*10); n1 = n2*ans; }
            let opts = [{t: ans, isCorrect: true}];
            while(opts.length < 4) {
                let f = ans + (Math.floor(Math.random()*10)-5);
                if(f !== ans && !opts.find(o => o.t === f)) opts.push({t: f, isCorrect: false});
            }
            return { q: `${n1} ${op} ${n2}`, options: opts.sort(() => Math.random()-0.5) };
        }

        function playStep() {
            if (currentStep >= config.total) {
                document.getElementById('video-screen').innerHTML = "<h1>🏆 أحسنت! انتهى التحدي</h1>";
                return;
            }

            let data;
            if (mode === 'math') {
                data = generateMath();
                speak("كم يساوي " + data.q.replace('×','ضرب').replace('÷','تقسيم'));
            } else {
                const m = manualData[currentStep];
                data = { q: m.q, qImg: m.qImg, options: [...m.options] };
                if(data.options.length > 1) data.options.sort(() => Math.random() - 0.5);
                speak(data.q || "اختر الإجابة");
            }

            const qImgEl = document.getElementById('q-main-img');
            document.getElementById('question-text').innerText = data.q || "";
            if(data.qImg) { qImgEl.src = data.qImg; qImgEl.style.display = 'block'; } else { qImgEl.style.display = 'none'; }

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            const letters = ['أ', 'ب', 'ج', 'د'];

            if(data.options.length === 1) {
                container.style.display = 'none';
            } else {
                container.style.display = 'grid';
                data.options.forEach((opt, i) => {
                    const card = document.createElement('div');
                    card.className = 'option-card';
                    if(opt.isCorrect) card.classList.add('correct-ans-target');
                    let imgPart = opt.img ? `<img src="${opt.img}" class="opt-img-display">` : '';
                    card.innerHTML = `<div class="letter-label">${letters[i]}</div>${imgPart}<span>${opt.text || opt.t || ''}</span>`;
                    opt.letter = letters[i];
                    container.appendChild(card);
                });
            }

            let timer = config.time;
            document.getElementById('timer-box').innerText = timer;
            let inter = setInterval(() => {
                timer--;
                document.getElementById('timer-box').innerText = timer;
                document.getElementById('audio-tick').play();
                if(timer <= 0) {
                    clearInterval(inter);
                    document.getElementById('audio-win').play();
                    if(data.options.length === 1) {
                        container.style.display = 'flex';
                        container.innerHTML = `<div class="option-card correct-glow" style="width:100%; font-size:1.5rem;"><span>${data.options[0].text}</span></div>`;
                        speak("الجواب " + data.options[0].text);
                    } else {
                        document.querySelectorAll('.correct-ans-target').forEach(el => el.classList.add('correct-glow'));
                        let corrects = data.options.filter(o => o.isCorrect);
                        let speechTxt = "الصح هو: ";
                        corrects.forEach(c => speechTxt += (c.text || c.t ? (c.text || c.t) : "الخيار " + c.letter) + " ");
                        speak(speechTxt);
                    }
                    setTimeout(() => { currentStep++; playStep(); }, 4000);
                }
            }, 1000);
        }
        addManualQ();
    </script>
</body>
</html>
